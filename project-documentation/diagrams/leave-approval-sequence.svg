<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="1200" viewBox="0 0 1760 1200"><rect x="0" y="0" width="1760" height="1200" fill="#fff"></rect><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f3b52"></path></marker></defs><text x="880" y="36" font-size="24" font-weight="700" text-anchor="middle" fill="#1b2a41" font-family="Segoe UI, Calibri, Arial, sans-serif">Sequence — a manager approves a leave request</text><text x="880" y="62" font-size="14" text-anchor="middle" fill="#555" font-family="Segoe UI, Calibri, Arial, sans-serif">PUT /api/leaves/:id/approve — the same path serves HR, and rejection (with a required reason) differs only in the final status</text><line x1="150" y1="156" x2="150" y2="1140" stroke="#9aa7bd" stroke-dasharray="6 5" stroke-width="1.5"></line><rect x="35" y="100" width="230" height="56" rx="8" fill="#eef1f6" stroke="#3d4a63" stroke-width="1.8"></rect><text x="150" y="119.5" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1b2a41" font-family="Segoe UI, Calibri, Arial, sans-serif">Manager</text><text x="150" y="136.5" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1b2a41" font-family="Segoe UI, Calibri, Arial, sans-serif">(browser)</text><line x1="420" y1="156" x2="420" y2="1140" stroke="#9aa7bd" stroke-dasharray="6 5" stroke-width="1.5"></line><rect x="305" y="100" width="230" height="56" rx="8" fill="#eef1f6" stroke="#3d4a63" stroke-width="1.8"></rect><text x="420" y="119.5" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1b2a41" font-family="Segoe UI, Calibri, Arial, sans-serif">React app</text><text x="420" y="136.5" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1b2a41" font-family="Segoe UI, Calibri, Arial, sans-serif">(leaveService, Axios)</text><line x1="720" y1="156" x2="720" y2="1140" stroke="#9aa7bd" stroke-dasharray="6 5" stroke-width="1.5"></line><rect x="605" y="100" width="230" height="56" rx="8" fill="#eef1f6" stroke="#3d4a63" stroke-width="1.8"></rect><text x="720" y="119.5" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1b2a41" font-family="Segoe UI, Calibri, Arial, sans-serif">Express API</text><text x="720" y="136.5" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1b2a41" font-family="Segoe UI, Calibri, Arial, sans-serif">middleware</text><line x1="1020" y1="156" x2="1020" y2="1140" stroke="#9aa7bd" stroke-dasharray="6 5" stroke-width="1.5"></line><rect x="905" y="100" width="230" height="56" rx="8" fill="#eef1f6" stroke="#3d4a63" stroke-width="1.8"></rect><text x="1020" y="119.5" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1b2a41" font-family="Segoe UI, Calibri, Arial, sans-serif">Leave controller</text><text x="1020" y="136.5" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1b2a41" font-family="Segoe UI, Calibri, Arial, sans-serif">decide()</text><line x1="1300" y1="156" x2="1300" y2="1140" stroke="#9aa7bd" stroke-dasharray="6 5" stroke-width="1.5"></line><rect x="1185" y="100" width="230" height="56" rx="8" fill="#eef1f6" stroke="#3d4a63" stroke-width="1.8"></rect><text x="1300" y="119.5" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1b2a41" font-family="Segoe UI, Calibri, Arial, sans-serif">Notification</text><text x="1300" y="136.5" font-size="14" font-weight="400" text-anchor="middle" dominant-baseline="middle" fill="#1b2a41" font-family="Segoe UI, Calibri, Arial, sans-serif">service</text><line x1="1600" y1="156" x2="1600" y2="1140" stroke="#9aa7bd" stroke-dasharray="6 5" stroke-width="1.5"></line><rect x="1485" y="100" width="230" height="56" rx="8" fill="#eef1f6" stroke="#3d4a63" stroke-width="1.8"></rect><text x="1600" y="128" font-size="14" font-weight="700" text-anchor="middle" dominant-baseline="middle" fill="#1b2a41" font-family="Segoe UI, Calibri, Arial, sans-serif">MongoDB</text><line x1="150" y1="200" x2="418" y2="200" stroke="#2f3b52" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="none"></line><text x="285" y="192" font-size="13" text-anchor="middle" fill="#1d2b45" font-family="Segoe UI, Calibri, Arial, sans-serif">Clicks Approve on a team request</text><line x1="420" y1="256" x2="718" y2="256" stroke="#2f3b52" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="none"></line><text x="570" y="232" font-size="13" text-anchor="middle" fill="#1d2b45" font-family="Segoe UI, Calibri, Arial, sans-serif">PUT /api/leaves/:id/approve</text><text x="570" y="248" font-size="13" text-anchor="middle" fill="#1d2b45" font-family="Segoe UI, Calibri, Arial, sans-serif">Authorization: Bearer &lt;JWT&gt;</text><path d="M720 320 h60 v24 h-58" fill="none" stroke="#2f3b52" stroke-width="1.6" marker-end="url(#a)"></path><text x="792" y="326" font-size="13" fill="#1d2b45" font-family="Segoe UI, Calibri, Arial, sans-serif">protect: verify JWT (HS256, scope org),</text><text x="792" y="342" font-size="13" fill="#1d2b45" font-family="Segoe UI, Calibri, Arial, sans-serif">load user + employee + organisation in one aggregation;</text><text x="792" y="358" font-size="13" fill="#1d2b45" font-family="Segoe UI, Calibri, Arial, sans-serif">refuse if deactivated, password changed or organisation suspended</text><line x1="720" y1="404" x2="1598" y2="404" stroke="#2f3b52" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="none"></line><text x="1160" y="396" font-size="13" text-anchor="middle" fill="#1d2b45" font-family="Segoe UI, Calibri, Arial, sans-serif">aggregate users ⋈ employees ⋈ organisations</text><line x1="1600" y1="444" x2="722" y2="444" stroke="#2f3b52" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="6 4"></line><text x="1160" y="436" font-size="13" text-anchor="middle" fill="#1d2b45" font-family="Segoe UI, Calibri, Arial, sans-serif">user, employee, organisation</text><path d="M720 494 h60 v24 h-58" fill="none" stroke="#2f3b52" stroke-width="1.6" marker-end="url(#a)"></path><text x="792" y="500" font-size="13" fill="#1d2b45" font-family="Segoe UI, Calibri, Arial, sans-serif">authorize('manager', 'hr') → else 403</text><text x="792" y="516" font-size="13" fill="#1d2b45" font-family="Segoe UI, Calibri, Arial, sans-serif">validateObjectId, approveLeaveRules → else 400/404</text><line x1="720" y1="564" x2="1018" y2="564" stroke="#2f3b52" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="none"></line><text x="870" y="556" font-size="13" text-anchor="middle" fill="#1d2b45" font-family="Segoe UI, Calibri, Arial, sans-serif">next() inside the organisation context</text><line x1="1020" y1="614" x2="1598" y2="614" stroke="#2f3b52" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="none"></line><text x="1310" y="606" font-size="13" text-anchor="middle" fill="#1d2b45" font-family="Segoe UI, Calibri, Arial, sans-serif">loadLeave(id): leave + applicant (scoped by organisationId)</text><line x1="1600" y1="654" x2="1022" y2="654" stroke="#2f3b52" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="6 4"></line><text x="1310" y="646" font-size="13" text-anchor="middle" fill="#1d2b45" font-family="Segoe UI, Calibri, Arial, sans-serif">leave, applicant</text><path d="M1020 704 h60 v24 h-58" fill="none" stroke="#2f3b52" stroke-width="1.6" marker-end="url(#a)"></path><text x="1092" y="710" font-size="13" fill="#1d2b45" font-family="Segoe UI, Calibri, Arial, sans-serif">assertCanDecide: decider is HR, or the applicant’s direct manager;</text><text x="1092" y="726" font-size="13" fill="#1d2b45" font-family="Segoe UI, Calibri, Arial, sans-serif">never the applicant themself → else 403</text><line x1="1020" y1="774" x2="1598" y2="774" stroke="#2f3b52" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="none"></line><text x="1310" y="750" font-size="13" text-anchor="middle" fill="#1d2b45" font-family="Segoe UI, Calibri, Arial, sans-serif">findOneAndUpdate({ _id, status: 'pending' },</text><text x="1310" y="766" font-size="13" text-anchor="middle" fill="#1d2b45" font-family="Segoe UI, Calibri, Arial, sans-serif">{ status: 'approved', approvedBy: manager })</text><line x1="1600" y1="814" x2="1022" y2="814" stroke="#2f3b52" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="6 4"></line><text x="1310" y="806" font-size="13" text-anchor="middle" fill="#1d2b45" font-family="Segoe UI, Calibri, Arial, sans-serif">updated leave (or null)</text><rect x="1080" y="826" width="430" height="38" rx="4" fill="#fff6e5" stroke="#e0b45c"></rect><text x="1088" y="842" font-size="12" fill="#6b4a0b" font-family="Segoe UI, Calibri, Arial, sans-serif">Atomic: only one decision can succeed. If the request is</text><text x="1088" y="858" font-size="12" fill="#6b4a0b" font-family="Segoe UI, Calibri, Arial, sans-serif">no longer pending, the result is null → 409 "already approved"</text><line x1="1020" y1="906" x2="1298" y2="906" stroke="#2f3b52" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="none"></line><text x="1160" y="898" font-size="13" text-anchor="middle" fill="#1d2b45" font-family="Segoe UI, Calibri, Arial, sans-serif">leaveDecided({ leave, applicant, deciderName })</text><line x1="1300" y1="946" x2="1598" y2="946" stroke="#2f3b52" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="none"></line><text x="1450" y="938" font-size="13" text-anchor="middle" fill="#1d2b45" font-family="Segoe UI, Calibri, Arial, sans-serif">insert notification for the applicant</text><line x1="1600" y1="986" x2="1302" y2="986" stroke="#2f3b52" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="6 4"></line><text x="1450" y="978" font-size="13" text-anchor="middle" fill="#1d2b45" font-family="Segoe UI, Calibri, Arial, sans-serif">ok</text><line x1="1020" y1="1036" x2="722" y2="1036" stroke="#2f3b52" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="6 4"></line><text x="870" y="1028" font-size="13" text-anchor="middle" fill="#1d2b45" font-family="Segoe UI, Calibri, Arial, sans-serif">200 { success: true, message: "Leave approved", data }</text><line x1="720" y1="1082" x2="422" y2="1082" stroke="#2f3b52" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="6 4"></line><text x="570" y="1074" font-size="13" text-anchor="middle" fill="#1d2b45" font-family="Segoe UI, Calibri, Arial, sans-serif">JSON response</text><line x1="420" y1="1128" x2="152" y2="1128" stroke="#2f3b52" stroke-width="1.6" marker-end="url(#a)" stroke-dasharray="6 4"></line><text x="285" y="1120" font-size="13" text-anchor="middle" fill="#1d2b45" font-family="Segoe UI, Calibri, Arial, sans-serif">"Leave approved"; the list refreshes from the API</text><text x="40" y="1178" font-size="12" fill="#555" font-family="Segoe UI, Calibri, Arial, sans-serif">Errors at any step go to the central error handler and return { success: false, message }. Sources: routes/leaveRoutes.js, middleware/authMiddleware.js, controllers/leaveController.js, services/notificationService.js.</text></svg>