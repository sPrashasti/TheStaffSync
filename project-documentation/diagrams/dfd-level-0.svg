2"></rect><text x="170" y="520" font-size="14" font-weight="700" fill="#1b2a41" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif">Manager</text></g><g><rect x="55" y="755" width="230" height="70" rx="2" fill="#eef1f6" stroke="#3d4a63" stroke-width="2.2"></rect><text x="170" y="790" font-size="14" font-weight="700" fill="#1b2a41" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif">HR Administrator</text></g><g><rect x="1205" y="255" width="250" height="70" rx="2" fill="#eef1f6" stroke="#3d4a63" stroke-width="2.2"></rect><text x="1330" y="290" font-size="14" font-weight="700" fill="#1b2a41" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif">Platform Administrator</text></g><g><rect x="1205" y="685" width="250" height="70" rx="2" fill="#eef1f6" stroke="#3d4a63" stroke-width="2.2"></rect><text x="1330" y="720" font-size="14" font-weight="700" fill="#1b2a41" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif">Email Service (SMTP)</text></g></g><g><g><rect x="-4" y="-2" width="8" height="4" rx="4" fill="#ffffff" stroke="#d6dbe4"></rect><text x="930" y="252.5" font-size="12" font-weight="500" fill="#1d2b45" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif">Organisation sign-up details,</text><text x="930" y="267.5" font-size="12" font-weight="500" fill="#1d2b45" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif">demo sign-in request (role)</text></g><g><rect x="-4" y="-2" width="8" height="4" rx="4" fill="#ffffff" stroke="#d6dbe4"></rect><text x="650" y="322.5" font-size="12" font-weight="500" fill="#1d2b45" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif">New HR account,</text><text x="650" y="337.5" font-size="12" font-weight="500" fill="#1d2b45" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif">session token</text></g><g><rect x="-4" y="-2" width="8" height="4" rx="4" fill="#ffffff" stroke="#d6dbe4"></rect><text x="470" y="223" font-size="12" font-weight="500" fill="#1d2b45" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif">Credentials, check-in / check-out,</text><text x="470" y="238" font-size="12" font-weight="500" fill="#1d2b45" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif">leave requests, training enrolment,</text><text x="470" y="253" font-size="12" font-weight="500" fill="#1d2b45" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif">contact-detail updates</text></g><g><rect x="-4" y="-2" width="8" height="4" rx="4" fill="#ffffff" stroke="#d6dbe4"></rect><text x="330" y="397.5" font-size="12" font-weight="500" fill="#1d2b45" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif">Own attendance and leave status,</text><text x="330" y="412.5" font-size="12" font-weight="500" fill="#1d2b45" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif">announcements, trainings, notifications</text></g><g><rect x="-4" y="-2" width="8" height="4" rx="4" fill="#ffffff" stroke="#d6dbe4"></rect><text x="450" y="444.5" font-size="12" font-weight="500" fill="#1d2b45" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif">Leave decisions (approve / reject + reason),</text><text x="450" y="459.5" font-size="12" font-weight="500" fill="#1d2b45" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif">trainings, announcements, team assignments</text></g><g><rect x="-4" y="-2" width="8" height="4" rx="4" fill="#ffffff" stroke="#d6dbe4"></rect><text x="390" y="574.5" font-size="12" font-weight="500" fill="#1d2b45" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif">Team attendance and leave,</text><text x="390" y="589.5" font-size="12" font-weight="500" fill="#1d2b45" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif">team dashboard, notifications</text></g><g><rect x="-4" y="-2" width="8" height="4" rx="4" fill="#ffffff" stroke="#d6dbe4"></rect><text x="205" y="642.5" font-size="12" font-weight="500" fill="#1d2b45" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif">People records, roles, reporting lines,</text><text x="205" y="657.5" font-size="12" font-weight="500" fill="#1d2b45" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif">company settings, leave decisions, content</text></g><g><rect x="-4" y="-2" width="8" height="4" rx="4" fill="#ffffff" stroke="#d6dbe4"></rect><text x="560" y="752.5" font-size="12" font-weight="500" fill="#1d2b45" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif">Company dashboard and reports,</text><text x="560" y="767.5" font-size="12" font-weight="500" fill="#1d2b45" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif">all attendance and leave records</text></g><g><rect x="-4" y="-2" width="8" height="4" rx="4" fill="#ffffff" stroke="#d6dbe4"></rect><text x="1110" y="467.5" font-size="12" font-weight="500" fill="#1d2b45" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif">Rename, suspend (with reason),</text><text x="1110" y="482.5" font-size="12" font-weight="500" fill="#1d2b45" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif">reactivate organisation</text></g><g><rect x="-4" y="-2" width="8" height="4" rx="4" fill="#ffffff" stroke="#d6dbe4"></rect><text x="1060" y="312.5" font-size="12" font-weight="500" fill="#1d2b45" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif">Organisation list and usage,</text><text x="1060" y="327.5" font-size="12" font-weight="500" fill="#1d2b45" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif">platform statistics, audit log</text></g><g><rect x="-4" y="-2" width="8" height="4" rx="4" fill="#ffffff" stroke="#d6dbe4"></rect><text x="1090" y="662.5" font-size="12" font-weight="500" fill="#1d2b45" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif">Password reset email</text><text x="1090" y="677.5" font-size="12" font-weight="500" fill="#1d2b45" text-anchor="middle" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif">(single-use link)</text></g></g><text x="40" y="935" font-size="12" font-weight="400" fill="#555" text-anchor="start" dominant-baseline="middle" font-family="Segoe UI, Calibri, Arial, sans-serif">All users sign in with an email and password and receive a JWT; every later flow carries that token. Source: server/routes/*.js, server/services/*.js (inspected 17 October 2026).</text></svg>