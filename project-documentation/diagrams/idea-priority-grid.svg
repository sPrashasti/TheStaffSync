<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1100" viewBox="0 0 1500 1100"><rect x="0" y="0" width="1500" height="1100" fill="#ffffff"></rect><text x="750" y="38" font-size="26" font-weight="700" fill="#1b2a41" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif">Idea Prioritisation — Importance × Feasibility</text><text x="750" y="64" font-size="14" fill="#555" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif">Retrospective placement. Blue = built (phases 1–21); amber = not built yet.</text><rect x="580" y="110" width="430" height="430" fill="#eef6ee"></rect><line x1="580" y1="110" x2="580" y2="970" stroke="#c9d1dc" stroke-dasharray="6 5"></line><line x1="150" y1="540" x2="1010" y2="540" stroke="#c9d1dc" stroke-dasharray="6 5"></line><line x1="150" y1="970" x2="1020" y2="970" stroke="#333" stroke-width="2"></line><line x1="150" y1="970" x2="150" y2="100" stroke="#333" stroke-width="2"></line><text x="580" y="1014" font-size="15" font-weight="700" fill="#1d2b45" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">Feasibility (effort, complexity, dependencies) →</text><text x="0" y="0" font-size="15" font-weight="700" text-anchor="middle" transform="translate(90, 540) rotate(-90)" font-family="Segoe UI, Calibri, Arial, sans-serif">Importance (value to HR, managers, employees) →</text><text x="795" y="122.9" font-size="13" font-weight="700" fill="#6b7a90" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">Do first: high importance, feasible</text><text x="365" y="122.9" font-size="13" font-weight="700" fill="#6b7a90" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">Plan carefully: high importance, harder</text><text x="795" y="939.9" font-size="13" font-weight="700" fill="#6b7a90" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">Quick wins: lower importance, easy</text><text x="365" y="939.9" font-size="13" font-weight="700" fill="#6b7a90" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">Later / not now</text><circle cx="752" cy="144.40000000000003" r="8" fill="#2f5fa8" stroke="#fff" stroke-width="2"></circle><text x="765" y="148.40000000000003" font-size="12.5" font-weight="400" fill="#1d2b45" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">Leave apply &amp; approve workflow</text><circle cx="820.8000000000001" cy="178.79999999999995" r="8" fill="#2f5fa8" stroke="#fff" stroke-width="2"></circle><text x="833.8000000000001" y="182.79999999999995" font-size="12.5" font-weight="400" fill="#1d2b45" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">Role-based access (E / M / HR)</text><circle cx="906.8" cy="230.4" r="8" fill="#2f5fa8" stroke="#fff" stroke-width="2"></circle><text x="919.8" y="234.4" font-size="12.5" font-weight="400" fill="#1d2b45" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">Check-in / check-out</text><circle cx="786.4" cy="247.60000000000002" r="8" fill="#2f5fa8" stroke="#fff" stroke-width="2"></circle><text x="799.4" y="251.60000000000002" font-size="12.5" font-weight="400" fill="#1d2b45" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">HR-managed accounts, reporting lines</text><circle cx="838" cy="333.6" r="8" fill="#2f5fa8" stroke="#fff" stroke-width="2"></circle><text x="851" y="337.6" font-size="12.5" font-weight="400" fill="#1d2b45" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">In-app notifications</text><circle cx="717.6" cy="316.4" r="8" fill="#2f5fa8" stroke="#fff" stroke-width="2"></circle><text x="730.6" y="320.4" font-size="12.5" font-weight="400" fill="#1d2b45" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-se