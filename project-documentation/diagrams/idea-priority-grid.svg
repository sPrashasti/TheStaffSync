99999" r="8" fill="#d48a1a" stroke="#fff" stroke-width="2"></circle><text x="283.4" y="681.5999999999999" font-size="12.5" font-weight="400" fill="#1d2b45" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">Native mobile app</text><circle cx="236" cy="712" r="8" fill="#d48a1a" stroke="#fff" stroke-width="2"></circle><text x="249" y="716" font-size="12.5" font-weight="400" fill="#1d2b45" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">Payroll</text><circle cx="1070" cy="130" r="8" fill="#2f5fa8"></circle><text x="1086" y="135" font-size="14" font-weight="400" fill="#1d2b45" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">Built</text><circle cx="1070" cy="160" r="8" fill="#d48a1a"></circle><text x="1086" y="165" font-size="14" font-weight="400" fill="#1d2b45" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">Not built yet</text><text x="1060" y="210" font-size="12.5" font-weight="400" fill="#555" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">Built items come from the git history (6–8 Oct 2026).</text><text x="1060" y="226.25" font-size="12.5" font-weight="400" fill="#555" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">Open items come from the README “Known</text><text x="1060" y="242.5" font-size="12.5" font-weight="400" fill="#555" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">limitations”, except performance reviews, mobile app</text><text x="1060" y="258.75" font-size="12.5" font-weight="400" fill="#555" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">and payroll, which are ideas never started.</text></svg>