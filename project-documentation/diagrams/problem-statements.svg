<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1890" height="890" viewBox="0 0 1890 890"><rect x="0" y="0" width="1890" height="890" fill="#ffffff"></rect><text x="945" y="38" font-size="26" font-weight="700" fill="#1b2a41" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif">Customer Problem Statement Canvas — StaffSync</text><text x="945" y="64" font-size="14" fill="#555" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif">Assumption-based: written from the problems StaffSync’s features address, not from recorded user research.</text><rect x="150" y="90" width="330" height="730" rx="6" fill="#f6f7f9" stroke="#d4d9e2" stroke-width="1.5" stroke-dasharray="none"></rect><text x="164" y="116" font-size="16" font-weight="700" fill="#333" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">I am</text><rect x="492" y="90" width="330" height="730" rx="6" fill="#f6f7f9" stroke="#d4d9e2" stroke-width="1.5" stroke-dasharray="none"></rect><text x="506" y="116" font-size="16" font-weight="700" fill="#333" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">I’m trying to</text><rect x="834" y="90" width="330" height="730" rx="6" fill="#f6f7f9" stroke="#d4d9e2" stroke-width="1.5" stroke-dasharray="none"></rect><text x="848" y="116" font-size="16" font-weight="700" fill="#333" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">But</text><rect x="1176" y="90" width="330" height="730" rx="6" fill="#f6f7f9" stroke="#d4d9e2" stroke-width="1.5" stroke-dasharray="none"></rect><text x="1190" y="116" font-size="16" font-weight="700" fill="#333" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">Because</text><rect x="1518" y="90" width="330" height="730" rx="6" fill="#f6f7f9" stroke="#d4d9e2" stroke-width="1.5" stroke-dasharray="none"></rect><text x="1532" y="116" font-size="16" font-weight="700" fill="#333" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">Which makes me feel</text><text x="40" y="245" font-size="20" font-weight="700" fill="#1b2a41" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">PS-1</text><rect x="171" y="152" width="294" height="194" fill="rgba(0,0,0,0.08)"></rect><rect x="168" y="148" width="294" height="194" fill="#fde68a" stroke="rgba(0,0,0,0.12)"></rect><text x="315" y="240.5" font-size="15" font-weight="400" fill="#1d2b45" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">An HR administrator responsible for the</text><text x="315" y="260" font-size="15" font-weight="400" fill="#1d2b45" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">whole company’s people records</text><rect x="513" y="152" width="294" height="194" fill="rgba(0,0,0,0.08)"></rect><rect x="510" y="148" width="294" height="194" fill="#93c5fd" stroke="rgba(0,0,0,0.12)"></rect><text x="657" y="240.5" font-size="15" font-weight="400" fill="#1d2b45" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">keep attendance and leave records</text><text x="657" y="260" font-size="15" font-weight="400" fill="#1d2b45" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">accurate and up to date</text><rect x="855" y="152" width="294" height="194" fill="rgba(0,0,0,0.08)"></rect><rect x="852" y="148" width="294" height="194" fill="#bfdbfe" stroke="rgba(0,0,0,0.12)"></rect><text x="999" y="240.5" font-size="15" font-weight="400" fill="#1d2b45" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">the records are spread across</text><text x="999" y="260" font-size="15" font-weight="400" fill="#1d2b45" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">spreadsheets, emails and paper</text><rect x="1197" y="152" width="294" height="194" fill="rgba(0,0,0,0.08)"></rect><rect x="1194" y="148" width="294" height="194" fill="#86efac" stroke="rgba(0,0,0,0.12)"></rect><text x="1341" y="240.5" font-size="15" font-weight="400" fill="#1d2b45" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">nothing captures attendance and leave</text><text x="1341" y="260" font-size="15" font-weight="400" fill="#1d2b45" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">at the moment they happen</text><rect x="1539" y="152" width="294" height="194" fill="rgba(0,0,0,0.08)"></rect><rect x="1536" y="148" width="294" height="194" fill="#fdba74" stroke="rgba(0,0,0,0.12)"></rect><text x="1683" y="240.5" font-size="15" font-weight="400" fill="#1d2b45" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">overloaded, and unsure whether the</text><text x="1683" y="260" font-size="15" font-weight="400" fill="#1d2b45" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">figures I report are right</text><text x="40" y="475" font-size="20" font-weight="700" fill="#1b2a41" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">PS-2</text><rect x="171" y="382" width="294" height="194" fill="rgba(0,0,0,0.08)"></rect><rect x="168" y="378" width="294" height="194" fill="#fde68a" stroke="rgba(0,0,0,0.12)"></rect><text x="315" y="480.25" font-size="15" font-weight="400" fill="#1d2b45" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">A manager with a team of direct reports</text><rect x="513" y="382" width="294" height="194" fill="rgba(0,0,0,0.08)"></rect><rect x="510" y="378" width="294" height="194" fill="#93c5fd" stroke="rgba(0,0,0,0.12)"></rect><text x="657" y="470.5" font-size="15" font-weight="400" fill="#1d2b45" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">decide my team’s leave quickly and know</text><text x="657" y="490" font-size="15" font-weight="400" fill="#1d2b45" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">who is working today</text><rect x="855" y="382" width="294" height="194" fill="rgba(0,0,0,0.08)"></rect><rect x="852" y="378" width="294" height="194" fill="#bfdbfe" stroke="rgba(0,0,0,0.12)"></rect><text x="999" y="470.5" font-size="15" font-weight="400" fill="#1d2b45" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">requests reach me by email and chat and</text><text x="999" y="490" font-size="15" font-weight="400" fill="#1d2b45" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">are easy to miss</text><rect x="1197" y="382" width="294" height="194" fill="rgba(0,0,0,0.08)"></rect><rect x="1194" y="378" width="294" height="194" fill="#86efac" stroke="rgba(0,0,0,0.12)"></rect><text x="1341" y="470.5" font-size="15" font-weight="400" fill="#1d2b45" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">there is no shared queue of requests and</text><text x="1341" y="490" font-size="15" font-weight="400" fill="#1d2b45" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">no status anyone can see</text><rect x="1539" y="382" width="294" height="194" fill="rgba(0,0,0,0.08)"></rect><rect x="1536" y="378" width="294" height="194" fill="#fdba74" stroke="rgba(0,0,0,0.12)"></rect><text x="1683" y="470.5" font-size="15" font-weight="400" fill="#1d2b45" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">frustrated, and blamed for decisions I</text><text x="1683" y="490" font-size="15" font-weight="400" fill="#1d2b45" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">never saw</text><text x="40" y="705" font-size="20" font-weight="700" fill="#1b2a41" text-anchor="start" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">PS-3</text><rect x="171" y="612" width="294" height="194" fill="rgba(0,0,0,0.08)"></rect><rect x="168" y="608" width="294" height="194" fill="#fde68a" stroke="rgba(0,0,0,0.12)"></rect><text x="315" y="710.25" font-size="15" font-weight="400" fill="#1d2b45" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">An employee</text><rect x="513" y="612" width="294" height="194" fill="rgba(0,0,0,0.08)"></rect><rect x="510" y="608" width="294" height="194" fill="#93c5fd" stroke="rgba(0,0,0,0.12)"></rect><text x="657" y="700.5" font-size="15" font-weight="400" fill="#1d2b45" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">apply for leave and know the outcome so</text><text x="657" y="720" font-size="15" font-weight="400" fill="#1d2b45" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">I can plan</text><rect x="855" y="612" width="294" height="194" fill="rgba(0,0,0,0.08)"></rect><rect x="852" y="608" width="294" height="194" fill="#bfdbfe" stroke="rgba(0,0,0,0.12)"></rect><text x="999" y="700.5" font-size="15" font-weight="400" fill="#1d2b45" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">I hear nothing until I chase my manager</text><text x="999" y="720" font-size="15" font-weight="400" fill="#1d2b45" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">or HR</text><rect x="1197" y="612" width="294" height="194" fill="rgba(0,0,0,0.08)"></rect><rect x="1194" y="608" width="294" height="194" fill="#86efac" stroke="rgba(0,0,0,0.12)"></rect><text x="1341" y="700.5" font-size="15" font-weight="400" fill="#1d2b45" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">a request has no visible status and no</text><text x="1341" y="720" font-size="15" font-weight="400" fill="#1d2b45" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">recorded reason when refused</text><rect x="1539" y="612" width="294" height="194" fill="rgba(0,0,0,0.08)"></rect><rect x="1536" y="608" width="294" height="194" fill="#fdba74" stroke="rgba(0,0,0,0.12)"></rect><text x="1683" y="710.25" font-size="15" font-weight="400" fill="#1d2b45" text-anchor="middle" font-family="Segoe UI, Calibri, Arial, sans-serif" font-style="normal">anxious and unable to make plans</text></svg>